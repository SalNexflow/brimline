packages:
  - apps/*
  - video

# Only packages listed here may run install scripts (pnpm blocks the rest by default).
allowBuilds:
  # Downloads the ffmpeg binary that `make demo-video` uses to write the MP4 (dev only, M11).
  ffmpeg-static: true
  sharp: false
  # Remotion's bundler: the platform binary comes as its own package, no install script needed.
  esbuild: false
  unrs-resolver: false
