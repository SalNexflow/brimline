# Runs the same quality gate as `make gate` on every push and pull request.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # setup-uv publishes only full version tags (no floating v10), so pin the release's commit.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: services/engine/uv.lock

      # Same entry points as on a laptop, so CI cannot drift from local runs.
      - name: Setup
        run: node scripts/tasks.mjs setup

      - name: Gate
        run: node scripts/tasks.mjs gate

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The engine's Docker image as the hosted demo runs it (demo mode, a web key, real Postgres with
  # the non-superuser roles): sign in as every role, one write per row-capped table. Catches
  # hosted-only bugs like DEFECT_LOG #81 before Render deploys them.
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Demo smoke test
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          node scripts/tasks.mjs demo-smoke
