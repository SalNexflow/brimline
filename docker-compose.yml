# Local PostgreSQL for development. Values come from .env (see .env.example).
# A fixed project name means every checkout of the repo shares one database container and volume,
# instead of failing on a name clash or depending on the folder name.
name: brimline

services:
  db:
    image: postgres:18.6-alpine
    environment:
      # The superuser only creates the cluster's roles (db/init/01-roles.sh); migrations, the
      # seed and the engine never use it (D34, closed in M11).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-brimline_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent folder.
      - brimline-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brimline"]
      interval: 2s
      timeout: 3s
      retries: 30

  # `make demo`: the whole app in containers, with fake data and prepared model replies (no
  # key needed). Not started by `make setup` or the gate, which run the engine and web directly.
  engine:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brimline_app:brimline_app_dev_only@db:5432/brimline_demo
      DATABASE_OWNER_URL: postgresql://brimline_owner:${POSTGRES_OWNER_PASSWORD:-brimline_dev_only}@db:5432/brimline_demo
      SESSION_SECRET: ${SESSION_SECRET:?run make setup first (it writes SESSION_SECRET to .env)}
      DEMO_LOGIN: "true"
      AI_MODE: ${DEMO_AI_MODE:-fake}
      DEMO_RESET_ON_START: "1"
      SIM_MACHINES: "true"
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 60

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      engine:
        condition: service_healthy
    environment:
      ENGINE_URL: http://engine:8000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  brimline-pgdata:
