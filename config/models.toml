# Model names, providers, prices and per-task settings for every model call
# (hard rule 8: config, not memory). Code reads these only from here. Update `checked` whenever
# a value changes.

checked = 2026-10-27
source = "DeepSeek API docs (pricing, chat completion, JSON mode) and Anthropic Claude API docs (models, pricing), read 2026-10-26"

[providers.deepseek]
base_url = "https://api.deepseek.com"   # OpenAI-format chat completions; key in DEEPSEEK_API_KEY

[providers.anthropic]
base_url = "https://api.anthropic.com"  # key in ANTHROPIC_API_KEY

# USD per million tokens. input = uncached input; cache_read = input served from the provider's
# prompt cache; cache_write = extra charge for writing the cache (none on DeepSeek).
#
# DeepSeek charges double in peak hours (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri). We record the
# PEAK price for every call, so a logged cost is never lower than what was actually billed.
[prices."deepseek-flash"]
provider = "deepseek"
input_usd_per_mtok = "0.30"
output_usd_per_mtok = "1.20"
cache_read_usd_per_mtok = "0.006"
cache_write_usd_per_mtok = "0"

[prices."deepseek-v4-pro"]
provider = "deepseek"
input_usd_per_mtok = "1.32"
output_usd_per_mtok = "3.96"
cache_read_usd_per_mtok = "0.044"
cache_write_usd_per_mtok = "0"

[prices."claude-opus-5-5"]
provider = "anthropic"
input_usd_per_mtok = "4.00"
output_usd_per_mtok = "20.00"
cache_read_usd_per_mtok = "0.20"
cache_write_usd_per_mtok = "5.00"

[prices."claude-haiku-5-5"]
provider = "anthropic"
# Rates for prompts up to 100K tokens; our prompts are far below that.
input_usd_per_mtok = "0.10"
output_usd_per_mtok = "0.50"
cache_read_usd_per_mtok = "0.01"
cache_write_usd_per_mtok = "0.125"

# Reading a customer's quote request into a structured draft.
[tasks.quote_extract]
model = "deepseek-flash"
effort = "low"          # extraction is not hard reasoning; measured in eval/results/RESULTS.md
max_tokens = 8000       # room for reasoning plus the JSON; a cut-off reply is rejected
prompt_version = "quote-extract-v1"

# Reading a planner's disruption message into typed events (times copied as written; code
# resolves them). Evaluated in eval/results/RESULTS.md.
[tasks.disruption_parse]
model = "deepseek-flash"
effort = "low"
max_tokens = 4000
prompt_version = "disruption-parse-v1"

# A plain-language summary of a re-plan, written from the code-computed diff only and checked
# against it before it is shown (anything not in the diff rejects it).
[tasks.replan_summary]
model = "deepseek-flash"
effort = "low"
max_tokens = 3000
prompt_version = "replan-summary-v1"

# Optional advice on a file's preview picture (M7). Advice only: shown under its own heading and
# never read by any check. Needs a model that reads images (DeepSeek's do not) and
# ANTHROPIC_API_KEY; switched on in config/files.toml [advice]. Off until a key is approved.
[tasks.file_advice]
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 1500
prompt_version = "file-advice-v1"

# Reading a search question into a typed filter (M8). The model never sees data, never writes
# SQL and is not told who is asking; code checks the filter and adds permissions.
[tasks.search_parse]
model = "deepseek-flash"
effort = "low"
max_tokens = 3000
prompt_version = "search-parse-v2"  # v2 (tuned on dev only): "in" for list fields; "my orders" needs no condition
