# The fictional shop. Everything in this file is invented for the demo: no real customers,
# people, brands, or machine models. Emails use the reserved .example domain (RFC 2606).
#
# Loaded by `python -m brimline_engine.db seed` into a freshly migrated database.
# Every seeded row gets `seed_time` as its timestamp, so two seeds produce identical data.

checked = 2026-10-25           # date this file was last reviewed
seed_time = 2026-10-19T08:00:00Z

[shop]
name = "Brimline Demo Shop"
time_zone = "Europe/Berlin"    # shifts and due dates are in this zone
currency = "EUR"

[[customers]]
code = "C-HARBOR"
name = "Harbor Lane Robotics Club"
email = "orders@harborlane.example"

[[customers]]
code = "C-WILLOW"
name = "Willow Street Dental Lab"
email = "lab@willowstreet.example"

[[customers]]
code = "C-COPPER"
name = "Copperleaf Cosplay Workshop"
email = "hello@copperleaf.example"

[[customers]]
code = "C-TALLOW"
name = "Tallowmere Bicycle Repairs"
email = "shop@tallowmere.example"

# One demo user per role, plus two customer logins for testing that customers are kept apart.
[[users]]
code = "U-STAFF"
display_name = "Sam Ortega"
role = "staff"

[[users]]
