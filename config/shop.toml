customer = "C-WILLOW"

[[materials]]
code = "PLA-BLACK"
name = "PLA, black"
process = "fdm"
color = "black"

[[materials]]
code = "PLA-WHITE"
name = "PLA, white"
process = "fdm"
color = "white"

[[materials]]
code = "PETG-BLACK"
name = "PETG, black"
process = "fdm"
color = "black"

[[materials]]
code = "PETG-ORANGE"
name = "PETG, orange"
process = "fdm"
color = "orange"

[[materials]]
code = "TPU-BLACK"
name = "TPU 95A, black"
process = "fdm"
color = "black"

[[materials]]
code = "RESIN-GREY"
name = "Standard resin, grey"
process = "resin"
color = "grey"

[[materials]]
code = "RESIN-CLEAR"
name = "Tough resin, clear"
process = "resin"
color = "clear"

[[materials]]
code = "AL-6061"
name = "Aluminium 6061 bar stock"
process = "cnc"
color = "silver"

# Generic machines. Build volumes are plausible for each class, not copied from any product.
[[machines]]
code = "FDM-1"
name = "FDM printer 1"
process = "fdm"
build_mm = [256, 256, 256]
materials = ["PLA-BLACK", "PLA-WHITE", "PETG-BLACK", "PETG-ORANGE", "TPU-BLACK"]

[[machines]]
code = "FDM-2"
name = "FDM printer 2"
process = "fdm"
build_mm = [256, 256, 256]
materials = ["PLA-BLACK", "PLA-WHITE", "PETG-BLACK", "PETG-ORANGE", "TPU-BLACK"]

[[machines]]
code = "FDM-3"
name = "FDM printer 3"
process = "fdm"
build_mm = [256, 256, 256]
materials = ["PLA-BLACK", "PLA-WHITE", "PETG-BLACK", "PETG-ORANGE"]

[[machines]]
code = "FDM-4"
name = "FDM printer 4 (large)"
process = "fdm"
build_mm = [350, 350, 400]
materials = ["PLA-BLACK", "PLA-WHITE", "PETG-BLACK"]

[[machines]]
code = "RESIN-1"
name = "Resin printer 1"
process = "resin"
build_mm = [218, 123, 235]
materials = ["RESIN-GREY", "RESIN-CLEAR"]

[[machines]]
code = "CNC-1"
name = "CNC mill 1"
process = "cnc"
build_mm = [400, 300, 150]
materials = ["AL-6061"]

# Grams on hand at seed time.
[stock]
PLA-BLACK = 4000
PLA-WHITE = 2500
PETG-BLACK = 3000
PETG-ORANGE = 800
TPU-BLACK = 500
RESIN-GREY = 2000
RESIN-CLEAR = 1000
AL-6061 = 12000

# Staffed hours. weekday is ISO (1 = Monday). Times are shop-local.
[[shifts]]
weekdays = [1, 2, 3, 4, 5]
starts = "08:00"
ends = "17:00"

[[shifts]]
weekdays = [6]
starts = "09:00"
ends = "13:00"

# Price rules. Invented numbers, in cents. The seed loads them as the first dated version of the
# price rules (price_rule_sets); staff add later versions in the app.
[price_rules]
effective_from = 2026-10-25
setup_cents = 1500
machine_minute_cents = { fdm = 6, resin = 9, cnc = 45 }
material_cents_per_gram = { PLA-BLACK = 3, PLA-WHITE = 3, PETG-BLACK = 4, PETG-ORANGE = 4, TPU-BLACK = 7, RESIN-GREY = 12, RESIN-CLEAR = 16, AL-6061 = 2 }
rush_multiplier_percent = 150
post_process_cents_per_part = { sanding = 200, painting = 350, assembly = 500 }

# A few existing orders so the lists are not empty and customer separation can be tested.
[[orders]]
customer = "C-HARBOR"
created_by = "U-STAFF"
due_date = 2026-10-30
lines = [
    { part = "Robot chassis plate", quantity = 4, material = "PETG-BLACK" },
    { part = "Wheel hub", quantity = 8, material = "PLA-BLACK" },
]

