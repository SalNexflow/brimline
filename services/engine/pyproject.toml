[project]
name = "brimline-engine"
version = "0.0.0"
description = "Brimline engine: scheduler, independent checker, file checker (FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",  # DeepSeek API calls, and FastAPI's TestClient (Starlette dropped httpx)
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes and pycodestyle; I: import order; B: likely bugs; UP: modern syntax;
# N: naming; SIM: simpler code; RUF: ruff's own checks; ANN: type annotations everywhere.
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]
# Line length is the formatter's job; the lines it cannot wrap are SQL strings, kept readable whole.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test clients return untyped responses and monkeypatch wrappers forward any arguments.
"tests/**" = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Deprecations fail the gate instead of scrolling past unnoticed.
filterwarnings = ["error"]
